  <rect width="2800" height="1760" fill="url(#pageBg)"/>
  <text x="72" y="78" class="title">组件制作交互方案 · 8 选 1</text>
  <text x="72" y="118" class="subtitle">目标：少填表、多选择、有预览；仍然把组件规格 / 新变体记录到“本次修改内容”，最后统一发送给 AI。</text>

