    <text x="228" y="118" class="chipDark">定义槽位</text>
    <text x="380" y="118" class="chipDark">创建变体</text>
    <text x="198" y="118" class="textTiny">→</text>
    <text x="354" y="118" class="textTiny">→</text>
    <rect x="36" y="170" width="568" height="128" rx="20" fill="#f8fafc"/>
