    <text x="60" y="506" class="label">变体</text>
    <rect x="168" y="476" width="112" height="52" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="206" y="510" class="chip">XL</text>
    <rect x="292" y="476" width="132" height="52" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="320" y="510" class="chipDark">default</text>
    <rect x="36" y="574" width="568" height="82" rx="20" fill="#7c3aed"/>
    <text x="222" y="626" class="button">记录到本次修改</text>
    <text x="40" y="690" class="textSmall">适合首次沉淀：按步骤降低认知负担。</text>
  </g>

