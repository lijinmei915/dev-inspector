    <text x="60" y="436" class="label">槽位</text>
    <rect x="168" y="406" width="126" height="52" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="196" y="440" class="chipDark">内容</text>
    <rect x="308" y="406" width="126" height="52" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="335" y="440" class="chipDark">图标</text>
    <rect x="448" y="406" width="116" height="52" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
