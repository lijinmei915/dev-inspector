    <rect x="326" y="478" width="250" height="50" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="348" y="511" class="text">状态标签</text>
    <rect x="494" y="486" width="58" height="34" rx="17" fill="#eef2ff"/>
