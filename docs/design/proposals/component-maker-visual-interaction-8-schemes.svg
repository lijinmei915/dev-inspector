    <rect x="36" y="324" width="568" height="210" rx="20" fill="#f8fafc"/>
    <text x="60" y="366" class="label">组件名</text>
    <rect x="168" y="336" width="396" height="54" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
